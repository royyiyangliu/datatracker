name: GPU 租赁价格更新

on:
  schedule:
    # 每周二、周五 UTC 03:00（北京时间 11:00）；与其他工作流的时间错开，数据无变化时不会提交
    - cron: '0 3 * * 2,5'
  workflow_dispatch:  # 允许手动触发
  push:
    # 抓取脚本或本工作流有改动时自动跑一次，验证数据源在 GitHub 上可访问
    paths:
      - 'scripts/fetch_gpu_prices.py'
      - '.github/workflows/gpu-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行抓取脚本
        run: python scripts/fetch_gpu_prices.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gpu docs/gpu.json
          # 有变更才 commit，避免无意义提交
          git diff --staged --quiet && exit 0
          git commit -m "data: gpu prices $(date -u +%Y-%m-%d)"
          # 其他工作流可能刚推送过，先变基再推
          git pull --rebase
          git push
