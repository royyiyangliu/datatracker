name: Ramp AI Index 更新

on:
  schedule:
    # 每天 UTC 16:30 = 北京时间 00:30；数据无变化时不会提交
    - cron: '30 16 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    # 抓取脚本或本工作流有改动时自动跑一次，验证爬虫在 GitHub 上可用
    paths:
      - 'scripts/fetch_ramp.py'
      - '.github/workflows/ramp-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行抓取脚本
        run: python scripts/fetch_ramp.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ramp docs/ramp.json
          # 有变更才 commit，避免无意义提交
          git diff --staged --quiet && exit 0
          git commit -m "data: ramp ai index $(date -u +%Y-%m-%d)"
          # 其他工作流可能刚推送过，先变基再推
          git pull --rebase
          git push
